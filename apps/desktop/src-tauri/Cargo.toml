[package]
name = "world-compass"
version = "0.5.0"
edition = "2021"

[lib]
name = "world_compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "=0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.38"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
